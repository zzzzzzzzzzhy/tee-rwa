version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: tee-rwa-db
    environment:
      POSTGRES_USER: tee_rwa
      POSTGRES_PASSWORD: tee_rwa_dev
      POSTGRES_DB: tee_rwa
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tee_rwa"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
