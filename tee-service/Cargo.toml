[package]
name = "tee-service"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
k256 = { version = "0.13", features = ["ecdsa", "arithmetic"] }
sha2 = "0.10"
rand = "0.8"
base64 = "0.21"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = "0.3"
